name: Ship to TestFlight

# Launch SparkConnect without a computer.
#
# Runs on GitHub's machines, so it needs neither Evan's laptop nor a local
# terminal. Trigger it from the Actions tab on a phone.
#
# ONE SECRET IS REQUIRED — Settings → Secrets and variables → Actions:
#
#   EXPO_TOKEN   expo.dev → account → Access Tokens → Create token
#
# That is the whole setup. Apple credentials are NOT stored here; EAS already
# holds the ones used for previous submissions on its own servers.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [ios, android, all]
        default: ios
      submit:
        description: 'Submit to the store after building'
        type: boolean
        default: true

concurrency:
  # A second run started by accident must not race the first into the store.
  group: ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THIS CHECK EXISTS BECAUSE THE MISTAKE IS INVISIBLE UNTIL APPLE MAKES IT
      # VISIBLE. "Re-run jobs" on an old run replays that run's ORIGINAL commit,
      # not the branch as it stands now — so it rebuilds an old app.json, ships
      # a build number that has already been uploaded, and dies at the submit
      # step 25 minutes and one paid build credit later with "You've already
      # submitted this build of the app." Nothing earlier in the log looks
      # wrong: credentials resolve, the archive uploads, the build goes green.
      #
      # A stale re-run is exactly "HEAD is not the tip of the branch it claims
      # to be on", which is cheap to detect right here.
      - name: This is not a stale re-run
        run: |
          BRANCH='${{ github.ref_name }}'
          git fetch --depth=1 origin "$BRANCH"
          TIP=$(git rev-parse FETCH_HEAD)
          HERE=$(git rev-parse HEAD)
          echo "branch    $BRANCH"
          echo "building  $HERE"
          echo "tip is    $TIP"
          if [ "$TIP" != "$HERE" ]; then
            echo "::error title=Stale re-run::This run is building ${HERE:0:7}, but ${BRANCH} is now at ${TIP:0:7}. Re-running an old run rebuilds its old commit — including its old build number, which Apple will reject as a duplicate. Start a fresh run instead: Actions → Ship to TestFlight → Run workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # THE SECOND WAY TO SHIP A DUPLICATE, and the one the stale-re-run check
      # does not catch. Picking `main` from the branch dropdown is a perfectly
      # fresh run of a perfectly current commit — it is just a commit whose
      # app.json still says 33, because the work sits on a feature branch. It
      # builds for five minutes and dies at submit, exactly like a stale re-run,
      # for a completely different reason.
      #
      # If any other branch carries a HIGHER build number, this is almost
      # certainly the wrong branch. Says which one to pick rather than just
      # refusing.
      - name: This branch has the newest build number
        run: |
          HERE=$(node -p "require('./app.json').expo.ios.buildNumber")
          echo "this ref ships build $HERE"
          git fetch --quiet --depth=1 origin '+refs/heads/*:refs/remotes/origin/*' || true
          BEST=""; BEST_N="$HERE"
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            [ "$ref" = "origin/HEAD" ] && continue
            N=$(git show "$ref:app.json" 2>/dev/null | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                try{console.log(JSON.parse(s).expo.ios.buildNumber)}catch{console.log('')}
              })" 2>/dev/null || true)
            case "$N" in ''|*[!0-9]*) continue;; esac
            if [ "$N" -gt "$BEST_N" ]; then BEST_N="$N"; BEST="$ref"; fi
          done
          if [ -n "$BEST" ]; then
            echo "::error title=Probably the wrong branch::You are building ${{ github.ref_name }}, which ships build $HERE. ${BEST#origin/} ships build $BEST_N — newer. Apple rejects a build number it already has, so this run would fail at submit after the build. Re-run and pick ${BEST#origin/} from the branch dropdown, or merge it first."
            exit 1
          fi
          echo "no branch carries a newer build number"

      - name: What is about to ship
        run: |
          node -e "
          const a = require('./app.json').expo;
          const e = require('./eas.json');
          console.log('version    ' + a.version + ' (' + a.ios.buildNumber + ')');
          console.log('bundle id  ' + a.ios.bundleIdentifier);
          console.log('ascAppId   ' + e.submit.production.ios.ascAppId);
          console.log('increment  ' + (e.build.production.autoIncrement ? 'AUTO' : 'off — ships exactly this number'));
          "

      # Every check below costs seconds here and 20+ minutes to discover after
      # an upload. A bundle error in particular only surfaces on EAS's builder.
      - name: Tests
        run: npm test

      - name: App.js bundles
        run: |
          npx --yes esbuild App.js --bundle --platform=neutral \
            --loader:.js=jsx --loader:.png=text --loader:.jpg=text \
            --outfile=/dev/null \
            --external:react --external:react-native --external:react-native-svg \
            --external:@expo/vector-icons \
            --external:@react-native-async-storage/async-storage \
            --external:expo --external:'expo-*' --external:react-native-purchases

      - name: Legal pages match the policy module
        run: npm run legal:check

      # The published allowance policy is what /api/ask-nec enforces. If it has
      # drifted from the app's own numbers, the build would ship advertising a
      # limit the backend does not honour — which is the bug this whole
      # generator exists to prevent.
      - name: Allowance policy matches the code
        run: npm run allowance:check

  ship:
    name: Build and submit
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The secrets context is not readable from a step-level `if`, so this is
      # a shell check on an env var. Written as an `if:` first, where it would
      # have silently evaluated false and let the run fail 40 lines later with
      # an opaque eas error instead.
      - name: Fail early if the token is missing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error title=EXPO_TOKEN missing::Add it at Settings → Secrets and variables → Actions. Create the token at expo.dev → account → Access Tokens."
            exit 1
          fi
          echo "EXPO_TOKEN is set"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci

      - name: Build${{ inputs.submit && ' and submit' || '' }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile production \
            --non-interactive \
            ${{ inputs.submit && '--auto-submit' || '--no-wait' }}

      - name: Where to look next
        if: always()
        run: |
          echo "Builds:      https://expo.dev/accounts"
          echo "TestFlight:  appstoreconnect.apple.com → TestFlight"
          echo ""
          echo "First three checks on the device, in this order:"
          echo "  1. Ask SparkAI anything open-ended — it should ANSWER."
          echo "     Still refusing means the backend is unreachable from the"
          echo "     phone, not that the fix failed. Check /api/ask-nec on"
          echo "     cellular with wifi off, and Vercel's SSO protection."
          echo "  2. Open the paywall — every plan should show a price."
          echo "     'Unavailable right now' means that product id does not"
          echo "     exist in App Store Connect."
          echo "  3. Fresh install — onboarding appears, disclaimer first."
